<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>约跑步</title>
<style>
  :root {
    --bg: #0b1210; --card: #151f1a; --card2: #1b2a22; --line: #24352c;
    --tx: #e8f2ec; --tx2: #8fa89b; --ac: #22c55e; --ac-dim: #16a34a;
    --red: #ef4444; --blue: #60a5fa; --pink: #f472b6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--tx);
    font: 16px/1.5 -apple-system, "HarmonyOS Sans", "MiSans", "Microsoft YaHei", sans-serif;
    max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  }
  button { font: inherit; border: 0; cursor: pointer; }
  input, textarea { font: inherit; }

  /* ---- 通用 ---- */
  .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .view.on { display: flex; }
  .pad { padding: 14px; }
  .btn {
    background: var(--ac-dim); color: #fff; border-radius: 12px;
    padding: 13px 18px; font-weight: 600; width: 100%;
  }
  .btn:active { opacity: .8; }
  .btn[disabled] { opacity: .45; }
  .btn.ghost { background: var(--card2); color: var(--tx); }
  .inp {
    width: 100%; background: var(--card2); border: 1px solid var(--line);
    color: var(--tx); border-radius: 12px; padding: 13px 14px; outline: none;
  }
  .inp:focus { border-color: var(--ac-dim); }
  .lab { color: var(--tx2); font-size: 13px; margin: 14px 2px 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .muted { color: var(--tx2); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ---- 登录 ---- */
  #view-login { justify-content: center; }
  .logo { text-align: center; margin-bottom: 22px; }
  .logo .t { font-size: 30px; font-weight: 800; letter-spacing: 2px; }
  .logo .t em { color: var(--ac); font-style: normal; }
  .logo .s { color: var(--tx2); font-size: 13px; margin-top: 4px; }
  .row2 { display: flex; gap: 10px; }
  .row2 .inp { flex: 1; }
  .row2 .btn { width: auto; white-space: nowrap; }
  #login-msg { min-height: 22px; margin-top: 12px; font-size: 13px; color: var(--ac); }
  #login-msg.err { color: var(--red); }

  /* ---- 顶栏 ---- */
  .top {
    padding: 14px 16px 10px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid var(--line);
  }
  .top .tt { font-size: 20px; font-weight: 700; }
  .gps { font-size: 12px; color: var(--tx2); display: flex; align-items: center; gap: 6px; }

  /* ---- 内容区 ---- */
  .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---- 跑者卡片 ---- */
  .runner { display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 10px; }
  .ava {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: var(--card2); display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: var(--ac);
  }
  .runner .mid { flex: 1; min-width: 0; }
  .runner .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .runner .ds { color: var(--ac); font-weight: 700; font-size: 15px; flex: none; text-align: right; }
  .runner .why { color: var(--tx2); font-size: 12.5px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .runner .tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
  .runner .tags span { font-size: 11px; color: var(--tx2); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 7px; }
  .g-m { color: var(--blue); } .g-f { color: var(--pink); }
  .mini {
    flex: none; background: var(--ac-dim); color: #fff; border-radius: 10px;
    padding: 9px 13px; font-size: 13.5px; font-weight: 600;
  }
  .mini.chat { background: var(--card2); color: var(--tx); }

  /* ---- 底部导航 ---- */
  .tabs { display: flex; border-top: 1px solid var(--line); background: var(--card); }
  .tabs button {
    flex: 1; background: none; color: var(--tx2); padding: 10px 0 12px; font-size: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tabs button .ic { font-size: 20px; line-height: 1; }
  .tabs button.on { color: var(--ac); }

  /* ---- 聊天 ---- */
  .chat-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border-bottom: 1px solid var(--line); background: var(--card);
  }
  .chat-head .back { background: none; color: var(--tx); font-size: 22px; padding: 2px 8px; }
  .chat-head .tt { font-weight: 700; font-size: 17px; }
  #chat-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 76%; padding: 10px 13px; border-radius: 14px; font-size: 15px; word-break: break-word; }
  .msg.me { align-self: flex-end; background: var(--ac-dim); border-bottom-right-radius: 4px; }
  .msg.he { align-self: flex-start; background: var(--card2); border-bottom-left-radius: 4px; }
  .msg .tm { display: block; font-size: 10.5px; opacity: .55; margin-top: 3px; }
  .chips { display: flex; gap: 8px; padding: 0 14px 8px; flex-wrap: wrap; }
  .chips button { background: var(--card2); color: var(--ac); border: 1px solid var(--line);
    border-radius: 16px; padding: 6px 12px; font-size: 12.5px; }
  .chat-foot { display: flex; gap: 10px; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  .chat-foot .inp { flex: 1; }
  .chat-foot .btn { width: auto; padding: 11px 20px; }

  /* ---- 会话列表 ---- */
  .convo { display: flex; gap: 12px; padding: 13px 14px; align-items: center; }
  .convo .mid { flex: 1; min-width: 0; }
  .convo .last { color: var(--tx2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- 空态 / 提示 ---- */
  .empty { text-align: center; color: var(--tx2); padding: 60px 30px; }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .toast {
    position: fixed; left: 50%; top: 18%; transform: translateX(-50%);
    background: rgba(20, 30, 25, .95); border: 1px solid var(--line); color: var(--tx);
    padding: 11px 20px; border-radius: 12px; font-size: 14px; z-index: 99;
    max-width: 86%; text-align: center; display: none;
  }
</style>
</head>
<body>

<!-- ======================= 登录 ======================= -->
<section id="view-login" class="view on">
  <div class="pad">
    <div class="logo">
      <div class="t">约<em>跑步</em></div>
      <div class="s">发现附近的跑者，一起约个时间开跑</div>
    </div>
    <div class="lab">服务器地址（电脑的局域网 IP）</div>
    <div class="row2">
      <input id="in-server" class="inp" placeholder="http://192.168.1.100:3001">
      <button id="btn-test" class="btn ghost">测试</button>
    </div>
    <div class="lab">手机号</div>
    <div class="row2">
      <input id="in-phone" class="inp" inputmode="tel" placeholder="13800000000">
      <button id="btn-otp" class="btn ghost">获取验证码</button>
    </div>
    <div class="lab">验证码（开发模式固定 123456）</div>
    <input id="in-code" class="inp" inputmode="numeric" placeholder="123456">
    <div style="margin-top:20px"><button id="btn-login" class="btn">登录 / 注册</button></div>
    <div id="login-msg"></div>
  </div>
</section>

<!-- ======================= 主界面 ======================= -->
<section id="view-main" class="view">
  <div class="top">
    <div class="tt" id="main-title">附近跑者</div>
    <div class="gps"><span id="gps-dot" class="dot" style="background:#6b7280"></span><span id="gps-txt">定位未开启</span></div>
  </div>
  <div class="body">

    <!-- 附近 -->
    <div id="tab-run" class="pad" style="display:none">
      <div id="run-list"></div>
    </div>

    <!-- 消息 -->
    <div id="tab-msg" class="pad" style="display:none">
      <div id="convo-list"></div>
    </div>

    <!-- 我的 -->
    <div id="tab-me" class="pad" style="display:none">
      <div class="card pad" style="text-align:center">
        <div style="font-size:34px;font-weight:800" id="me-name">—</div>
        <div class="muted" id="me-phone" style="margin-top:3px"></div>
      </div>
      <div class="card pad" style="margin-top:12px">
        <div class="lab" style="margin-top:0">定位上报状态</div>
        <div class="muted" id="me-gps">等待定位…</div>
        <div class="lab">服务器</div>
        <div class="muted" id="me-server" style="word-break:break-all"></div>
      </div>
      <div style="margin-top:16px"><button id="btn-logout" class="btn ghost">退出登录</button></div>
    </div>
  </div>

  <div class="tabs">
    <button id="tabbtn-run" class="on"><span class="ic">🏃</span>附近跑者</button>
    <button id="tabbtn-msg"><span class="ic">💬</span>约跑消息</button>
    <button id="tabbtn-me"><span class="ic">👤</span>我的</button>
  </div>
</section>

<!-- ======================= 聊天 ======================= -->
<section id="view-chat" class="view">
  <div class="chat-head">
    <button class="back" id="btn-chat-back">‹</button>
    <div class="tt" id="chat-title">聊天</div>
  </div>
  <div id="chat-body"></div>
  <div class="chips">
    <button data-t="明早7点，一起约个跑步？">明早7点约吗</button>
    <button data-t="今晚8点夜跑，老地方见？">今晚8点夜跑</button>
    <button data-t="好呀，发个定位过来～">发个定位</button>
  </div>
  <div class="chat-foot">
    <input id="chat-inp" class="inp" placeholder="说点什么…">
    <button id="btn-send" class="btn">发送</button>
  </div>
</section>

<div id="toast" class="toast"></div>

<script>
'use strict';
/* ================= 状态与工具 ================= */
var LS = 'yuepao_state';
var state = {};
try { state = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { state = {}; }
function save() { localStorage.setItem(LS, JSON.stringify(state)); }

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var toastTimer = null;
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2600);
}
function normServer(u) {
  u = (u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
  return u.replace(/\/+$/, '');
}
function fmtDist(km) {
  if (km == null) return '位置未知';
  return km < 1 ? Math.max(50, Math.round(km * 1000 / 50) * 50) + 'm' : km.toFixed(1) + 'km';
}
function fmtAgo(iso) {
  if (!iso) return '';
  var m = (Date.now() - new Date(iso).getTime()) / 60000;
  if (m < 1) return '刚刚活跃';
  if (m < 60) return Math.floor(m) + '分钟前活跃';
  if (m < 1440) return Math.floor(m / 60) + '小时前活跃';
  return Math.floor(m / 1440) + '天前活跃';
}
function fmtTime(ts) {
  var d = new Date(ts);
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

/* ================= API ================= */
function api(path, opts, noThrow) {
  opts = opts || {};
  var h = { 'Content-Type': 'application/json' };
  if (state.token) h['Authorization'] = 'Bearer ' + state.token;
  return fetch(state.server + path, {
    method: opts.method || 'GET',
    headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function (r) {
    return r.json().then(function (j) {
      if (r.status === 401 && !noThrow) { logout('登录已过期，请重新登录'); throw new Error('401'); }
      if (!r.ok && !noThrow) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}

/* ================= 视图切换 ================= */
var pollers = [];
function clearPollers() { pollers.forEach(clearInterval); pollers = []; }
function poll(fn, ms) { fn(); pollers.push(setInterval(fn, ms)); }
function show(id) {
  ['view-login', 'view-main', 'view-chat'].forEach(function (v) {
    $(v).classList.toggle('on', v === id);
  });
  clearPollers();
}
var curTab = 'run';
function switchTab(tab) {
  curTab = tab;
  ['run', 'msg', 'me'].forEach(function (t) {
    $('tab-' + t).style.display = t === tab ? '' : 'none';
    $('tabbtn-' + t).classList.toggle('on', t === tab);
  });
  $('main-title').textContent = tab === 'run' ? '附近跑者' : (tab === 'msg' ? '约跑消息' : '我的');
  clearPollers();
  if (tab === 'run') poll(loadNearby, 8000);
  if (tab === 'msg') poll(loadConvos, 5000);
  if (tab === 'me') renderMe();
}

/* ================= 定位引擎 ================= */
var gps = { fix: null, native: false, fallbackTimer: null, lastPost: 0, failMsg: '' };

window.onNativeLocation = function (lat, lng, acc) {
  gps.native = true;
  handleFix(lat, lng, acc);
};

function handleFix(lat, lng, acc) {
  gps.fix = { lat: lat, lng: lng, acc: acc, at: Date.now() };
  renderGps();
  var now = Date.now();
  if (!state.token) return;
  if (now - gps.lastPost >= 8000 || !state.reportedOnce) {
    gps.lastPost = now;
    state.reportedOnce = true; save();
    api('/api/location/report', { method: 'POST', body: { lat: lat, lng: lng } })
      .then(function () { renderGps(); })
      .catch(function (e) { gps.failMsg = '上报失败：' + e.message; renderGps(); });
  }
}

function startBrowserGeo() {
  if (!navigator.geolocation) { gps.failMsg = '浏览器不支持定位'; renderGps(); return; }
  navigator.geolocation.watchPosition(function (p) {
    handleFix(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
  }, function (e) {
    gps.failMsg = '定位失败：' + e.message; renderGps();
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

function startLocation() {
  gps.failMsg = '';
  if (window.AndroidBridge && window.AndroidBridge.startLocation) {
    window.AndroidBridge.startLocation(); // 原生 GPS，onNativeLocation 回调
    // 原生 20 秒没给到坐标（室内 GPS 弱/权限异常）时启用网页定位兜底
    if (gps.fallbackTimer) clearTimeout(gps.fallbackTimer);
    gps.fallbackTimer = setTimeout(function () {
      if (!gps.fix) startBrowserGeo();
    }, 20000);
  } else {
    startBrowserGeo(); // 浏览器调试环境
  }
  renderGps();
}

function renderGps() {
  var dot = $('gps-dot'), txt = $('gps-txt');
  var me = $('me-gps');
  var html;
  if (gps.fix) {
    var stale = Date.now() - gps.fix.at > 60000;
    dot.style.background = stale ? '#eab308' : '#22c55e';
    txt.textContent = (stale ? '信号弱' : '定位中') + ' ±' + Math.round(gps.fix.acc || 0) + 'm';
    html = '纬度 ' + gps.fix.lat.toFixed(5) + '，经度 ' + gps.fix.lng.toFixed(5) +
      '（误差 ±' + Math.round(gps.fix.acc || 0) + ' 米），每 8 秒上报一次服务器';
  } else if (gps.failMsg) {
    dot.style.background = '#ef4444';
    txt.textContent = '定位失败';
    html = esc(gps.failMsg) + '。请检查手机定位服务与 APP 定位权限。';
  } else {
    dot.style.background = '#6b7280';
    txt.textContent = '定位中…';
    html = '正在搜索 GPS / 网络定位，室内请靠近窗户';
  }
  if (me) me.innerHTML = html;
}

/* ================= 附近跑者 ================= */
function loadNearby() {
  if (!state.token) return;
  return api('/api/run/nearby?radius_km=50&top_n=30').then(function (d) {
    var box = $('run-list');
    if (!d.items || !d.items.length) {
      box.innerHTML = '<div class="empty"><div class="big">🏃</div>' +
        '附近 50 公里内暂时没有跑者<br><span class="muted">确认对方也装了 APP 并开启定位</span></div>';
      return;
    }
    box.innerHTML = d.items.map(function (it) {
      var online = it.active_at && (Date.now() - new Date(it.active_at).getTime()) < 10 * 60 * 1000;
      var g = it.gender === 'm' ? '<span class="g-m">♂</span>' : '<span class="g-f">♀</span>';
      var tags = (it.common_tags && it.common_tags.length
        ? it.common_tags : (it.tags || []).slice(0, 3)).map(function (t) {
          return '<span>' + esc(t) + '</span>';
        }).join('');
      var act = it.already_matched
        ? '<button class="mini chat" data-chat="' + esc(it.id) + '|' + esc(it.name || '跑者') + '">去聊天</button>'
        : '<button class="mini" data-like="' + esc(it.id) + '|' + esc(it.name || '跑者') + '">约TA跑</button>';
      return '<div class="card runner">' +
        '<div class="ava">' + esc((it.name || '跑')[0]) + '</div>' +
        '<div class="mid">' +
          '<div class="nm">' + g + ' ' + esc(it.name || '神秘跑者') +
            '<span class="muted">' + (it.age || '') + '岁</span>' +
            (online ? '<span class="dot" style="background:#22c55e"></span>' : '') + '</div>' +
          '<div class="why">' + esc(it.reason || '') + ' · ' + fmtAgo(it.active_at) + '</div>' +
          (tags ? '<div class="tags">' + tags + '</div>' : '') +
        '</div>' +
        '<div class="ds">' + fmtDist(it.distance_km) + '</div>' + act +
        '</div>';
    }).join('');
  }).catch(function (e) {
    if (e.message !== '401') toast('刷新失败：' + e.message);
  });
}

$('run-list').addEventListener('click', function (ev) {
  var like = ev.target.getAttribute && ev.target.getAttribute('data-like');
  if (like) {
    var p1 = like.split('|');
    api('/api/matches/like', { method: 'POST', body: { targetUserId: p1[0] } })
      .then(function (r) {
        if (r.matched) { toast('🎉 约跑成功！开始聊时间地点吧'); openChat(p1[0], p1[1]); }
        else toast('已发送，等对方回应');
      }).catch(function (e) { toast('约跑失败：' + e.message); });
    return;
  }
  var chat = ev.target.getAttribute && ev.target.getAttribute('data-chat');
  if (chat) {
    var p2 = chat.split('|');
    openChat(p2[0], p2[1]);
  }
});

/* ================= 会话列表 ================= */
function loadConvos() {
  if (!state.token) return;
  return api('/api/matches').then(function (list) {
    var box = $('convo-list');
    if (!list.length) {
      box.innerHTML = '<div class="empty"><div class="big">💬</div>' +
        '还没有约跑会话<br><span class="muted">去“附近跑者”找个人约起来</span></div>';
      return;
    }
    box.innerHTML = list.map(function (c) {
      return '<div class="card convo" data-open="' + esc(c.userId) + '|' + esc(c.displayName) + '">' +
        '<div class="ava">' + esc((c.displayName || '跑')[0]) + '</div>' +
        '<div class="mid"><div class="nm">' + esc(c.displayName) +
          (c.isOnline ? '<span class="dot" style="background:#22c55e;margin-left:6px"></span>' : '') +
        '</div>' +
        '<div class="last">' + (c.lastMessage ? esc(c.lastMessage) : '打个招呼，约个时间吧') + '</div></div>' +
        '<span class="muted">' + fmtTime(c.lastMessageAt) + '</span></div>';
    }).join('');
  }).catch(function () {});
}
$('convo-list').addEventListener('click', function (ev) {
  var open = ev.target.closest && ev.target.closest('[data-open]');
  if (open) {
    var p = open.getAttribute('data-open').split('|');
    openChat(p[0], p[1]);
  }
});

/* ================= 聊天 ================= */
var chatPeer = { id: '', name: '' };
function openChat(id, name) {
  chatPeer = { id: id, name: name || '跑者' };
  $('chat-title').textContent = chatPeer.name;
  $('chat-body').innerHTML = '';
  show('view-chat');
  poll(loadMsgs, 2500);
}
function loadMsgs() {
  return api('/api/messages/' + chatPeer.id).then(function (list) {
    var box = $('chat-body');
    box.innerHTML = list.map(function (m) {
      var mine = m.senderId === state.me.id;
      return '<div class="msg ' + (mine ? 'me' : 'he') + '">' + esc(m.text) +
        '<span class="tm">' + fmtTime(m.createdAt) + '</span></div>';
    }).join('') || '<div class="empty"><div class="big">👟</div>还没有消息，约个时间开跑吧</div>';
    box.scrollTop = box.scrollHeight;
  }).catch(function () {});
}
function sendMsg() {
  var inp = $('chat-inp');
  var text = inp.value.trim();
  if (!text || !chatPeer.id) return;
  inp.value = '';
  api('/api/messages/send', { method: 'POST', body: { targetUserId: chatPeer.id, text: text } })
    .then(loadMsgs).catch(function (e) { toast('发送失败：' + e.message); });
}
$('btn-send').addEventListener('click', sendMsg);
$('chat-inp').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendMsg(); });
document.querySelector('.chips').addEventListener('click', function (ev) {
  if (ev.target.tagName === 'BUTTON') {
    $('chat-inp').value = ev.target.getAttribute('data-t');
    sendMsg();
  }
});
$('btn-chat-back').addEventListener('click', function () {
  show('view-main');
  switchTab(curTab);
});

/* ================= 登录 ================= */
function loginMsg(t, err) {
  var el = $('login-msg');
  el.textContent = t || '';
  el.classList.toggle('err', !!err);
}
$('btn-test').addEventListener('click', function () {
  var s = normServer($('in-server').value);
  if (!s) { loginMsg('请先填服务器地址', true); return; }
  state.server = s; save();
  loginMsg('测试中…');
  fetch(s + '/api/health').then(function (r) { return r.json(); }).then(function (j) {
    loginMsg('✓ 服务器连接正常');
  }).catch(function () { loginMsg('✗ 连不上，检查地址与电脑防火墙', true); });
});
$('btn-otp').addEventListener('click', function () {
  var phone = $('in-phone').value.trim();
  if (!phone) { loginMsg('请填手机号', true); return; }
  api('/api/auth/send-otp', { method: 'POST', body: { phone: phone } }, true)
    .then(function () { loginMsg('验证码已发送（开发模式填 123456）'); })
    .catch(function (e) { loginMsg('发送失败：' + e.message, true); });
});
$('btn-login').addEventListener('click', function () {
  var server = normServer($('in-server').value);
  var phone = $('in-phone').value.trim();
  var code = $('in-code').value.trim();
  if (!server) { loginMsg('请填服务器地址', true); return; }
  if (!phone || !code) { loginMsg('请填手机号和验证码', true); return; }
  state.server = server;
  loginMsg('登录中…');
  api('/api/auth/verify-otp', { method: 'POST', body: { phone: phone, code: code } })
    .then(function (r) {
      state.token = r.token;
      return api('/api/auth/me');
    })
    .then(function (me) {
      state.me = me;
      state.phone = phone;
      // 没有昵称（或服务端兜底的纯数字尾号）就自动起一个，方便对方认出
      if (!me.display_name || /^\d+$/.test(me.display_name)) {
        var nick = '跑者' + phone.slice(-4);
        return api('/api/users/' + me.id, { method: 'PUT', body: { display_name: nick } })
          .then(function (u) { state.me = u; }).catch(function () {});
      }
    })
    .then(function () { save(); enterMain(); })
    .catch(function (e) {
      if (e.message !== '401') loginMsg('登录失败：' + (e.message === 'Invalid OTP' ? '验证码不对（固定 123456）' : e.message), true);
    });
});

/* ================= 主界面 ================= */
function enterMain() {
  show('view-main');
  switchTab('run');
  renderMe();
  startLocation();
  if (window.AndroidBridge) window.AndroidBridge.startLocation();
}
function renderMe() {
  if (!state.me) return;
  $('me-name').textContent = state.me.display_name || '跑者';
  $('me-phone').textContent = '手机号 ' + (state.phone || state.me.phone || '');
  $('me-server').textContent = state.server || '';
  renderGps();
}
$('tabbtn-run').addEventListener('click', function () { switchTab('run'); });
$('tabbtn-msg').addEventListener('click', function () { switchTab('msg'); });
$('tabbtn-me').addEventListener('click', function () { switchTab('me'); });
$('btn-logout').addEventListener('click', function () { logout('已退出登录'); });

function logout(msg) {
  state.token = null; state.me = null; state.reportedOnce = false;
  gps.fix = null;
  save();
  show('view-login');
  $('in-server').value = state.server || '';
  $('in-phone').value = state.phone || '';
  if (msg) toast(msg);
}

/* ================= 启动 ================= */
(function boot() {
  $('in-server').value = state.server || '';
  $('in-phone').value = state.phone || '';
  if (state.token && state.server) {
    api('/api/auth/me', null, true).then(function (me) {
      state.me = me; save();
      enterMain();
    }).catch(function () {
      logout('登录已过期');
    });
  }
})();
</script>
</body>
</html>
